<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fazaia Registration Form</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<div class="header">
<h1>Fazaia College of Education for Women, Peshawar</h1>
<h2>Student Registration Form</h2>
<p>Please complete the form below with accurate academic and personal details.</p>
</div>
<form id="registrationForm">
<section class="card"><h3>Personal Information</h3>
<div class="grid">
<div><label>Full Name</label><input required></div>
<div><label>Father Name</label><input required></div>
<div><label>Date of Birth</label><input type="date"></div>
<div><label>Gender</label><select><option>Female</option><option>Male</option><option>Other</option></select></div>
<div><label>CNIC/B-Form</label><input></div>
<div><label>Phone</label><input></div>
<div class="full"><label>Address</label><textarea rows="4"></textarea></div>
</div></section>
<section class="card"><h3>Academic Information</h3>
<div class="grid">
<div><label>Roll No</label><input></div>
<div><label>Student ID</label><input></div>
<div><label>Program</label><select><option>BS Computer Science</option><option>BS Psychology</option><option>BS Mathematics</option><option>B.Ed</option><option>BS English</option><option>BS Physical Education</option></select></div>
<div><label>Semester/Class</label><input></div>
<div class="full"><label>Department</label><select><option>Computer Science</option><option>B.Ed</option><option>Physical Education</option><option>Psychology</option><option>Mathematics</option><option>English</option></select></div>
<div><label>Admission Year</label><input type="number"></div>
<div><label>Email</label><input type="email"></div>
</div></section>
<section class="card"><h3>Emergency And Additional Details</h3>
<div class="grid">
<div><label>Emergency Contact</label><input></div>
<div><label>Phone</label><input></div>
<div class="full"><label>Remarks</label><textarea rows="4"></textarea></div>
</div></section>
<div class="buttons"><button type="reset">Reset</button><button type="submit">Submit Form</button></div>
</form></div><script src="script.js"></script></body></html>
