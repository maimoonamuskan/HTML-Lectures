<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fazaia College Student Registration Form</title>
  <style>
    :root {
      --primary: #0f4c81;
      --secondary: #1e6fb6;
      --accent: #e8f2fb;
      --text: #233142;
      --muted: #64748b;
      --border: #d7e3ef;
      --bg: #f7fbff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #eef7ff 0%, #f9fcff 100%);
      color: var(--text);
      line-height: 1.5;
    }

    .page {
      max-width: 980px;
      margin: 32px auto;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 35px rgba(15, 76, 129, 0.12);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      padding: 28px 32px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: 0.95;
    }

    form {
      padding: 28px 32px 32px;
    }

    .section {
      margin-bottom: 24px;
      padding: 18px;
      background: var(--accent);
      border: 1px solid #d9e8f7;
      border-radius: 12px;
    }

    .section h2 {
      margin: 0 0 14px;
      font-size: 18px;
      color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      background: white;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(30, 111, 182, 0.16);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      padding: 11px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .submit {
      background: var(--primary);
      color: white;
    }

    .reset {
      background: #e2e8f0;
      color: #334155;
    }

    .note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .page { padding: 12px; }
      form { padding: 20px; }
      .header { padding: 22px 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <h1>Fazaia College Student Registration Form</h1>
        <p>Please complete the form below with accurate academic and personal details.</p>
      </div>

      <form>
        <div class="section">
          <h2>Personal Information</h2>
          <div class="grid">
            <div class="field">
              <label for="fullName">Full Name</label>
              <input id="fullName" name="fullName" type="text" placeholder="Enter full name" required />
            </div>
            <div class="field">
              <label for="fatherName">Father's Name</label>
              <input id="fatherName" name="fatherName" type="text" placeholder="Enter father name" required />
            </div>
            <div class="field">
              <label for="dob">Date of Birth</label>
              <input id="dob" name="dob" type="date" required />
            </div>
            <div class="field">
              <label for="gender">Gender</label>
              <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="cnic">CNIC / B-Form Number</label>
              <input id="cnic" name="cnic" type="text" placeholder="Enter CNIC or B-Form" required />
            </div>
            <div class="field">
              <label for="phone">Phone Number</label>
              <input id="phone" name="phone" type="tel" placeholder="03XX-XXXXXXX" required />
            </div>
            <div class="field full">
              <label for="address">Residential Address</label>
              <textarea id="address" name="address" placeholder="Enter complete address"></textarea>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Academic Information</h2>
          <div class="grid">
            <div class="field">
              <label for="rollNumber">Roll Number</label>
              <input id="rollNumber" name="rollNumber" type="text" placeholder="Enter roll number" required />
            </div>
            <div class="field">
              <label for="studentId">Student ID</label>
              <input id="studentId" name="studentId" type="text" placeholder="Enter student ID" />
            </div>
            <div class="field">
              <label for="program">Program</label>
              <select id="program" name="program" required>
                <option value="">Select program</option>
                <option>BS</option>
                <option>BSc</option>
                <option>Intermediate</option>
                <option>FSc</option>
                <option>ICS</option>
              </select>
            </div>
            <div class="field">
              <label for="semester">Semester / Class</label>
              <input id="semester" name="semester" type="text" placeholder="e.g. 3rd Semester" required />
            </div>
            <div class="field full">
              <label for="department">Department</label>
              <select id="department" name="department" required>
                <option value="">Select department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Software Engineering</option>
                <option>Electrical Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Civil Engineering</option>
                <option>Business Administration</option>
                <option>Management Sciences</option>
                <option>Aviation Management</option>
                <option>English</option>
                <option>Mathematics</option>
                <option>Physics</option>
                <option>Chemistry</option>
                <option>Biology</option>
                <option>Mass Communication</option>
                <option>Political Science</option>
                <option>Economics</option>
              </select>
            </div>
            <div class="field">
              <label for="admissionYear">Admission Year</label>
              <input id="admissionYear" name="admissionYear" type="number" min="2000" max="2100" placeholder="e.g. 2025" required />
            </div>
            <div class="field">
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" placeholder="Enter email address" required />
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Emergency & Additional Details</h2>
          <div class="grid">
            <div class="field">
              <label for="emergencyName">Emergency Contact Name</label>
              <input id="emergencyName" name="emergencyName" type="text" placeholder="Enter contact name" />
            </div>
            <div class="field">
              <label for="emergencyPhone">Emergency Contact Phone</label>
              <input id="emergencyPhone" name="emergencyPhone" type="tel" placeholder="03XX-XXXXXXX" />
            </div>
            <div class="field full">
              <label for="remarks">Remarks</label>
              <textarea id="remarks" name="remarks" placeholder="Add any additional information"></textarea>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="reset" type="reset">Reset</button>
          <button class="submit" type="submit">Submit Form</button>
        </div>
        <p class="note">All fields marked with required are mandatory for registration.</p>
      </form>
    </div>
  </div>
</body>
</html>
